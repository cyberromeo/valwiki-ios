name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package unsigned IPA
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          echo "CURRENT_PROJECT_VERSION=${{ github.run_number }}"

      - name: Build (unsigned, device)
        run: |
          set +e
          xcodebuild \
            -project ValWiki.xcodeproj \
            -target ValWiki \
            -configuration Release \
            -sdk iphoneos \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            VALIDATE_PRODUCT=NO > build.log 2>&1
          STATUS=$?
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log
          if [ $STATUS -ne 0 ]; then
            grep -E "error:" build.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u > errors.txt
            echo "$(wc -l < errors.txt) error lines"
            split -l 20 errors.txt errchunk_
            for f in errchunk_*; do
              msg=$(awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); gsub(/\r/,""); print}' "$f")
              echo "::error title=xcodebuild $f::$msg"
            done
            tail -n 60 build.log
            exit 1
          fi

      - name: Package IPA
        run: |
          APP=$(find build -type d -name "ValWiki.app" -path "*Release-iphoneos*" | head -n 1)
          if [ -z "$APP" ]; then echo "ValWiki.app not found"; find build -name "*.app"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ValWiki-unsigned.ipa Payload
          ls -lh ValWiki-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValWiki-unsigned-ipa
          path: ValWiki-unsigned.ipa
          if-no-files-found: error

      - name: Publish to the "latest-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build ValWiki-unsigned.ipa \
            --title "ValWiki build ${{ github.run_number }}" \
            --notes "Unsigned IPA built from ${{ github.sha }}. Sideload it with AltStore, SideStore, Sideloadly or TrollStore." \
            --prerelease \
            --target ${{ github.sha }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
